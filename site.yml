---
site:
  title: OpenShift Kafka Day Roadshow
  url: https://github.com/maximilianoPizarro/wshop-kafka-debezium
  start_page: kafka-day-roadshow::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/dialvare/rhdp_showroom_theme/releases/download/v2.0.4-ops/ui-bundle.zip
    snapshot: true
  # Directory form required so Antora overlays partials, css, and favicon.ico.
  # static_files in content/supplemental-ui/ui.yml promote only .nojekyll + favicon.ico
  # to the site root (img/** must stay under _/img for the theme logo paths).
  supplemental_files: ./content/supplemental-ui

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false

output:
  dir: ./www

asciidoc:
  attributes:
    toclevels: 2
