apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: mailpit
    app.kubernetes.io/part-of: cdc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:latest
          ports:
            - containerPort: 8025
              name: http
            - containerPort: 1025
              name: smtp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: mailpit
  ports:
    - name: http
      port: 8025
      targetPort: 8025
    - name: smtp
      port: 1025
      targetPort: 1025
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mailpit
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  to:
    kind: Service
    name: mailpit
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
