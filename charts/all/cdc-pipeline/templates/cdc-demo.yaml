apiVersion: v1
kind: Secret
metadata:
  name: cdc-postgresql-secret
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
stringData:
  POSTGRESQL_DATABASE: {{ .Values.postgresql.database }}
  POSTGRESQL_USER: {{ .Values.postgresql.username }}
  POSTGRESQL_PASSWORD: {{ .Values.postgresql.password }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdc-postgresql-init
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  # RHEL postgresql image only sources *.sh under postgresql-init/ (not raw .sql).
  01-cdc.sh: |
    #!/bin/bash
    set -euo pipefail
    echo "=> bootstrapping CDC schema and replication role"
    psql -v ON_ERROR_STOP=1 --username postgres --dbname "$POSTGRESQL_DATABASE" <<'EOSQL'
    ALTER SYSTEM SET wal_level = 'logical';
    ALTER SYSTEM SET max_replication_slots = 4;
    ALTER SYSTEM SET max_wal_senders = 4;
    ALTER ROLE {{ .Values.postgresql.username }} WITH REPLICATION;

    CREATE TABLE IF NOT EXISTS customers (
      id SERIAL PRIMARY KEY,
      first_name VARCHAR(100) NOT NULL,
      last_name  VARCHAR(100) NOT NULL,
      email      VARCHAR(255) UNIQUE NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS orders (
      id          SERIAL PRIMARY KEY,
      customer_id INTEGER REFERENCES customers(id),
      product     VARCHAR(255) NOT NULL,
      amount      DECIMAL(10,2) NOT NULL,
      status      VARCHAR(50) DEFAULT 'pending',
      created_at  TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO customers (first_name, last_name, email) VALUES
      ('Ana',    'Garcia',    'ana.garcia@neuralbank.io'),
      ('Carlos', 'Lopez',     'carlos.lopez@neuralbank.io'),
      ('Maria',  'Rodriguez', 'maria.rodriguez@neuralbank.io'),
      ('Pedro',  'Martinez',  'pedro.martinez@neuralbank.io'),
      ('Laura',  'Fernandez', 'laura.fernandez@neuralbank.io')
    ON CONFLICT (email) DO NOTHING;

    INSERT INTO orders (customer_id, product, amount, status)
    SELECT * FROM (VALUES
      (1, 'Personal Loan', 15000.00, 'approved'),
      (2, 'Credit Card',    5000.00, 'pending'),
      (3, 'Mortgage',     250000.00, 'reviewing'),
      (4, 'Auto Loan',     35000.00, 'approved'),
      (5, 'Business Line',100000.00, 'pending')
    ) AS v(customer_id, product, amount, status)
    WHERE NOT EXISTS (SELECT 1 FROM orders LIMIT 1);

    GRANT SELECT ON ALL TABLES IN SCHEMA public TO {{ .Values.postgresql.username }};
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO {{ .Values.postgresql.username }};

    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'cdc_publication') THEN
        CREATE PUBLICATION cdc_publication FOR TABLE customers, orders;
      END IF;
    END $$;
    EOSQL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdc-postgresql-start
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  # Runs on every start so redeploys with an existing PVC still get REPLICATION + publication.
  01-ensure-cdc.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username postgres --dbname "$POSTGRESQL_DATABASE" <<'EOSQL'
    ALTER ROLE {{ .Values.postgresql.username }} WITH REPLICATION;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO {{ .Values.postgresql.username }};
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO {{ .Values.postgresql.username }};
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'cdc_publication') THEN
        IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'customers')
           AND EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'orders') THEN
          CREATE PUBLICATION cdc_publication FOR TABLE customers, orders;
        END IF;
      END IF;
    END $$;
    EOSQL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdc-postgresql-cfg
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  custom.conf: |
    wal_level = logical
    max_replication_slots = 4
    max_wal_senders = 4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cdc-postgresql-data
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-postgresql
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app: cdc-postgresql
    app.kubernetes.io/part-of: cdc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdc-postgresql
  template:
    metadata:
      labels:
        app: cdc-postgresql
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: cdc-postgresql-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: init-scripts
              mountPath: /opt/app-root/src/postgresql-init
            - name: start-scripts
              mountPath: /opt/app-root/src/postgresql-start
            - name: pg-cfg
              mountPath: /opt/app-root/src/postgresql-cfg
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cdc-postgresql-data
        - name: init-scripts
          configMap:
            name: cdc-postgresql-init
            defaultMode: 0755
        - name: start-scripts
          configMap:
            name: cdc-postgresql-start
            defaultMode: 0755
        - name: pg-cfg
          configMap:
            name: cdc-postgresql-cfg
---
apiVersion: v1
kind: Service
metadata:
  name: cdc-postgresql
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app: cdc-postgresql
spec:
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: cdc-postgresql
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: cdc-connect
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    strimzi.io/use-connector-resources: "true"
spec:
  version: "4.2.0"
  replicas: 2
  bootstrapServers: cdc-cluster-kafka-bootstrap:9093
  authentication:
    type: scram-sha-512
    username: cdc-user
    passwordSecret:
      secretName: cdc-user
      password: password
  tls:
    trustedCertificates:
      - secretName: cdc-cluster-cluster-ca-cert
        certificate: ca.crt
  groupId: cdc-connect-cluster
  configStorageTopic: cdc-connect-configs
  offsetStorageTopic: cdc-connect-offsets
  statusStorageTopic: cdc-connect-status
  config:
    offset.storage.replication.factor: 3
    config.storage.replication.factor: 3
    status.storage.replication.factor: 3
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: true
    value.converter.schemas.enable: true
  build:
    output:
      type: docker
      image: image-registry.openshift-image-registry.svc:5000/kafka-cdc/cdc-connect:latest
    plugins:
      - name: debezium-postgresql
        artifacts:
          - type: zip
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/3.0.2.Final/debezium-connector-postgres-3.0.2.Final-plugin.zip
      - name: http-sink
        artifacts:
          - type: zip
            url: https://github.com/Aiven-Open/http-connector-for-apache-kafka/releases/download/v0.9.0/http-connector-for-apache-kafka-0.9.0.zip
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef:
        name: connect-metrics-config
        key: connect-metrics-config.yml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: connect-metrics-config
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  connect-metrics-config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
    - pattern: kafka.connect<type=connect-worker-metrics, connector=([^>]+)><>([^:]+)
      name: kafka_connect_worker_$2
      type: GAUGE
      labels:
        connector: "$1"
    - pattern: kafka.connect<type=connect-worker-metrics><>([^:]+)
      name: kafka_connect_worker_$1
      type: GAUGE
    - pattern: kafka.connect<type=connector-task-metrics, connector=([^,]+), task=([^>]+)><>([^:]+)
      name: kafka_connect_task_$3
      type: GAUGE
      labels:
        connector: "$1"
        task: "$2"
    - pattern: debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^>]+)><>([^:]+)
      name: debezium_metrics_$4
      type: GAUGE
      labels:
        plugin: "$1"
        context: "$2"
        server: "$3"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: debezium-postgresql-source
  namespace: kafka-cdc
  labels:
    strimzi.io/cluster: cdc-connect
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: cdc-postgresql
    database.port: "5432"
    database.user: {{ .Values.postgresql.username }}
    database.password: {{ .Values.postgresql.password }}
    database.dbname: {{ .Values.postgresql.database }}
    topic.prefix: cdc
    schema.include.list: public
    table.include.list: "public.customers,public.orders"
    plugin.name: pgoutput
    publication.name: cdc_publication
    publication.autocreate.mode: disabled
    slot.name: debezium_cdc
    decimal.handling.mode: string
    tombstones.on.delete: false
    snapshot.mode: initial
    errors.tolerance: all
    errors.deadletterqueue.topic.name: dlq.cdc-errors
    errors.deadletterqueue.topic.replication.factor: 3
    errors.deadletterqueue.context.headers.enable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdc-email-transformer
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  server.py: |
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json, urllib.request, os, sys

    MAILPIT = os.environ.get("MAILPIT_URL", "http://mailpit.kafka-cdc.svc:8025/api/v1/send")

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
            try:
                event = json.loads(body)
                if "payload" in event:
                    event = event["payload"]
                after = event.get("after") or event
                op = event.get("op", "u")
                source = event.get("source", {})
                table = source.get("table", "unknown")
                ops = {"c": "Created", "u": "Updated", "d": "Deleted", "r": "Snapshot"}
                action = ops.get(op, op)
                name = f"{after.get('first_name', '')} {after.get('last_name', '')}".strip() or str(after.get("id", ""))
                rows = "".join(f"<tr><td><b>{k}</b></td><td>{v}</td></tr>" for k, v in after.items())
                mail = {
                    "From": {"Email": "cdc-pipeline@workshop.io", "Name": "CDC Pipeline"},
                    "To": [{"Email": "admin@workshop.io", "Name": "Workshop Admin"}],
                    "Subject": f"CDC {action} - {table}: {name}",
                    "HTML": f"<h2>CDC Event - Record {action}</h2><p>Table: <b>{table}</b> | Operation: <b>{action}</b></p><table border='1'>{rows}</table><hr><small>CDC Pipeline - Debezium + AMQ Streams</small>"
                }
                req = urllib.request.Request(MAILPIT, json.dumps(mail).encode(), {"Content-Type": "application/json"})
                with urllib.request.urlopen(req, timeout=5) as resp:
                    print(f"email sent: {action} {table} {name}", flush=True)
                    self.send_response(resp.status)
                    self.end_headers()
                    self.wfile.write(resp.read())
            except Exception as e:
                print(f"email skipped: {e}", file=sys.stderr, flush=True)
                self.send_response(200)
                self.end_headers()
                self.wfile.write(json.dumps({"status": "skipped", "reason": str(e)}).encode())

    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-email-transformer
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app: cdc-email-transformer
    app.kubernetes.io/part-of: cdc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdc-email-transformer
  template:
    metadata:
      labels:
        app: cdc-email-transformer
    spec:
      containers:
        - name: transformer
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          env:
            - name: MAILPIT_URL
              value: "http://mailpit.kafka-cdc.svc:8025/api/v1/send"
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
      volumes:
        - name: script
          configMap:
            name: cdc-email-transformer
---
apiVersion: v1
kind: Service
metadata:
  name: cdc-email-transformer
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selector:
    app: cdc-email-transformer
  ports:
    - port: 8080
      targetPort: 8080
