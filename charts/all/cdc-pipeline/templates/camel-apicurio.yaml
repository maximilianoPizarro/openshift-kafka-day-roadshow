{{- $domain := .Values.clusterDomain | default "apps.cluster.example.com" }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: kafkasql-journal
  namespace: kafka-cdc
  labels:
    strimzi.io/cluster: cdc-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: -1
    retention.bytes: -1
{{- range $topic := list "camel.schema-check" "camel.validated" "camel.schema-errors" "camel.public.customers" "camel.public.orders" }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ $topic }}
  namespace: kafka-cdc
  labels:
    strimzi.io/cluster: cdc-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  partitions: 3
  replicas: 3
{{- end }}
---
apiVersion: registry.apicur.io/v1
kind: ApicurioRegistry3
metadata:
  name: cdc-registry
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  app:
    replicas: 1
    storage:
      type: kafkasql
      kafkasql:
        bootstrapServers: cdc-cluster-kafka-bootstrap:9092
    ingress:
      enabled: false
    podDisruptionBudget:
      enabled: false
    podTemplateSpec:
      spec:
        containers:
          - name: apicurio-registry-app
            resources:
              requests:
                memory: 512Mi
                cpu: 100m
              limits:
                memory: 1Gi
                cpu: "500m"
            startupProbe:
              httpGet:
                path: /health/live
                port: 9000
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30
            livenessProbe:
              httpGet:
                path: /health/live
                port: 9000
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 6
            readinessProbe:
              httpGet:
                path: /health/ready
                port: 9000
              initialDelaySeconds: 20
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 12
  ui:
    replicas: 1
    ingress:
      enabled: false
    env:
      - name: REGISTRY_API_URL
        value: https://cdc-registry-kafka-cdc.{{ $domain }}/apis/registry/v3
    podDisruptionBudget:
      enabled: false
    podTemplateSpec:
      spec:
        containers:
          - name: apicurio-registry-ui
            resources:
              requests:
                memory: 256Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 200m
            volumeMounts:
              - name: ui-nginx
                mountPath: /opt/app-root/etc/nginx.default.d/workshop.conf
                subPath: workshop.conf
        volumes:
          - name: ui-nginx
            configMap:
              name: cdc-registry-ui-nginx
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cdc-registry
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  host: cdc-registry-kafka-cdc.{{ $domain }}
  to:
    kind: Service
    name: cdc-registry-app-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cdc-registry-ui
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  host: cdc-registry-ui-kafka-cdc.{{ $domain }}
  to:
    kind: Service
    name: cdc-registry-ui-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdc-registry-ui-nginx
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  workshop.conf: |
    sub_filter_once on;
    sub_filter '</head>' '<style>.pf-m-grid.pf-v6-c-table{display:table!important;width:100%!important;table-layout:fixed!important}.pf-m-grid.pf-v6-c-table thead{display:table-header-group!important}.pf-m-grid.pf-v6-c-table tbody{display:table-row-group!important}.pf-m-grid.pf-v6-c-table tr.pf-v6-c-table__tr{display:table-row!important}.pf-v6-c-table :where(td,th){display:table-cell!important;max-width:none!important;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}.pf-v6-c-table :where(td,th):first-child{width:46%!important;white-space:normal!important}.pf-v6-c-table :where(td,th):last-child{width:2.5rem!important}</style></head>';
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdc-registry-schemas
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  customers-value.json: |
    {
      "$schema": "https://json-schema.org/draft/2020-12/schema",
      "$id": "https://neuralbank.io/schemas/customers-value.json",
      "title": "NeuralBank customer",
      "description": "One row from public.customers after a PostgreSQL change. Camel rejects the event when first_name, last_name, or email is missing. Other columns are optional so a new database column does not break this contract.",
      "type": "object",
      "additionalProperties": true,
      "examples": [
        {
          "id": 42,
          "first_name": "Sofia",
          "last_name": "Gonzalez",
          "email": "sofia.gonzalez@neuralbank.io",
          "created_at": 1705312200000000
        }
      ],
      "required": ["first_name", "last_name", "email"],
      "properties": {
        "id": {
          "type": "integer",
          "description": "Primary key assigned by PostgreSQL. Absent when you publish a new customer through the Kafka Bridge."
        },
        "first_name": {
          "type": "string",
          "minLength": 1,
          "description": "Customer given name.",
          "examples": ["Sofia"]
        },
        "last_name": {
          "type": "string",
          "minLength": 1,
          "description": "Customer family name.",
          "examples": ["Gonzalez"]
        },
        "email": {
          "type": "string",
          "pattern": "^[^@]+@[^@]+\\.[^@]+$",
          "description": "Unique contact email. The notification pipeline uses this address.",
          "examples": ["sofia.gonzalez@neuralbank.io"]
        },
        "phone": {
          "type": ["string", "null"],
          "description": "Optional phone. Present only after the instructor adds the column."
        },
        "created_at": {
          "type": ["integer", "string", "null"],
          "description": "Row timestamp. Debezium sends epoch microseconds or an ISO-8601 string."
        }
      }
    }
  orders-value.json: |
    {
      "$schema": "https://json-schema.org/draft/2020-12/schema",
      "$id": "https://neuralbank.io/schemas/orders-value.json",
      "title": "NeuralBank order",
      "description": "One row from public.orders. amount is a string because Debezium emits DECIMAL values that way. status is the banking workflow state.",
      "type": "object",
      "additionalProperties": true,
      "examples": [
        {
          "id": 38,
          "customer_id": 42,
          "product": "Mortgage",
          "amount": "345678.90",
          "status": "pending",
          "created_at": 1705312260000000
        }
      ],
      "required": ["product", "amount", "status", "customer_id"],
      "properties": {
        "id": {
          "type": "integer",
          "description": "Primary key assigned by PostgreSQL."
        },
        "customer_id": {
          "type": "integer",
          "description": "Foreign key to public.customers.id."
        },
        "product": {
          "type": "string",
          "minLength": 1,
          "description": "Banking product name.",
          "examples": ["Mortgage", "Personal Loan", "Credit Card"]
        },
        "amount": {
          "type": "string",
          "pattern": "^[0-9]+(\\.[0-9]+)?$",
          "description": "Order amount as text. Example: 345678.90. Not a JSON number.",
          "examples": ["15000.00"]
        },
        "status": {
          "type": "string",
          "enum": ["pending", "approved", "reviewing", "rejected"],
          "description": "Workflow state written by the simulator."
        },
        "created_at": {
          "type": ["integer", "string", "null"],
          "description": "Row timestamp from PostgreSQL, as emitted by Debezium."
        }
      }
    }
  neuralbank-cdc.yaml: |
    apiVersion: v3.1.0
    kind: DataContract
    id: neuralbank-cdc
    info:
      title: NeuralBank CDC contract
      version: 1.1.0
      description: Agreement for customer and order rows that leave PostgreSQL through Debezium. Camel rejects a row that breaks the required fields.
      status: active
      dataClassification: confidential
    team:
      name: neuralbank-platform
      domain: banking
      contact: platform@neuralbank.io
    schemas:
      - name: customers-value
        type: jsonschema
        location: workshop/customers-value:2
        fields:
          id:
            description: Primary key assigned by PostgreSQL. Missing on a Bridge publish.
          first_name:
            description: Customer given name. Required.
            tags: [IDENTITY]
          last_name:
            description: Customer family name. Required.
            tags: [IDENTITY]
          email:
            description: Unique contact email used by the notification pipeline.
            pii: true
            classification: confidential
            tags: [PII, EMAIL]
          phone:
            description: Optional phone. Present only after the instructor adds the column.
            pii: true
            classification: confidential
            tags: [PII]
          created_at:
            description: Row timestamp emitted by Debezium.
      - name: orders-value
        type: jsonschema
        location: workshop/orders-value:2
        fields:
          id:
            description: Primary key assigned by PostgreSQL.
          customer_id:
            description: Foreign key to public.customers.id.
          product:
            description: Banking product, such as Mortgage or Personal Loan.
          amount:
            description: Money as text, for example 15000.00. Debezium emits decimals as strings.
          status:
            description: Workflow state. One of pending, approved, reviewing, rejected.
          created_at:
            description: Row timestamp emitted by Debezium.
    quality:
      accuracy:
        - name: customer-email-shape
          expression: "email.matches('.*@.*\\\\..*')"
          threshold: 1.0
        - name: order-amount-text
          expression: "amount.size() > 0"
          threshold: 1.0
      completeness:
        - field: first_name
          threshold: 1.0
        - field: last_name
          threshold: 1.0
        - field: email
          threshold: 1.0
        - field: product
          threshold: 1.0
        - field: amount
          threshold: 1.0
        - field: status
          threshold: 1.0
        - field: customer_id
          threshold: 1.0
      freshness:
        maxStaleness: PT1M
    serviceLevel:
      availability: 0.99
      latency:
        p99: PT2S
  seed.py: |
    import json
    import time
    import urllib.error
    import urllib.request
    from pathlib import Path

    BASE = "http://cdc-registry-app-service.kafka-cdc.svc:8080"
    ROOT = Path("/schemas")
    ARTIFACTS = {
        "customers-value": {
            "name": "NeuralBank customer",
            "description": "Contract for public.customers. Required: first_name, last_name, email. Optional: id, phone, created_at. Extra columns are allowed.",
        },
        "orders-value": {
            "name": "NeuralBank order",
            "description": "Contract for public.orders. Required: product, amount (string), status, customer_id. Status is pending, approved, reviewing, or rejected.",
        },
    }

    def request(method, url, body=None):
        data = None if body is None else json.dumps(body).encode()
        req = urllib.request.Request(url, data=data, method=method)
        if body is not None:
            req.add_header("Content-Type", "application/json")
        try:
            with urllib.request.urlopen(req, timeout=10) as resp:
                return resp.status, resp.read()
        except urllib.error.HTTPError as exc:
            return exc.code, exc.read()

    def wait_ready():
        deadline = time.time() + 600
        url = BASE + "/apis/registry/v3/groups/workshop/artifacts"
        while time.time() < deadline:
            try:
                status, _ = request("GET", url)
                print("registry reachable", status, flush=True)
                if status < 500:
                    return
            except Exception as exc:
                print("waiting for registry", exc, flush=True)
            time.sleep(10)
        raise SystemExit("registry not ready")

    def ensure(artifact_id, meta):
        content = (ROOT / f"{artifact_id}.json").read_text()
        labels = {"domain": "neuralbank", "table": artifact_id.split("-")[0]}
        payload = {
            "artifactId": artifact_id,
            "artifactType": "JSON",
            "name": meta["name"],
            "description": meta["description"],
            "labels": labels,
            "firstVersion": {
                "version": "1",
                "name": meta["name"],
                "description": meta["description"],
                "content": {"content": content, "contentType": "application/json"},
            },
        }
        status, body = request("POST", BASE + "/apis/registry/v3/groups/workshop/artifacts", payload)
        print(artifact_id, "create", status, body[:300], flush=True)
        if status not in (200, 409):
            raise SystemExit(f"create {artifact_id} failed {status}")
        status, current = request("GET", BASE + f"/apis/registry/v3/groups/workshop/artifacts/{artifact_id}")
        existing = {}
        if status == 200:
            existing = json.loads(current).get("labels") or {}
        merged = dict(existing)
        merged.update(labels)
        status, body = request(
            "PUT",
            BASE + f"/apis/registry/v3/groups/workshop/artifacts/{artifact_id}",
            {"name": meta["name"], "description": meta["description"], "labels": merged},
        )
        print(artifact_id, "meta", status, body[:300], flush=True)
        if status not in (200, 204):
            raise SystemExit(f"meta {artifact_id} failed {status}")
        # The compatibility checker cannot read draft 2020-12. Turn the rule off, publish, then turn it back on.
        status, body = request(
            "DELETE",
            BASE + f"/apis/registry/v3/groups/workshop/artifacts/{artifact_id}/rules/COMPATIBILITY",
        )
        print(artifact_id, "rule-off", status, body[:200], flush=True)
        if status not in (200, 204, 404):
            raise SystemExit(f"delete rule {artifact_id} failed {status}")
        version = {
            "version": "2",
            "name": meta["name"],
            "description": meta["description"],
            "content": {"content": content, "contentType": "application/json"},
        }
        status, body = request(
            "POST",
            BASE + f"/apis/registry/v3/groups/workshop/artifacts/{artifact_id}/versions",
            version,
        )
        print(artifact_id, "version", status, body[:400], flush=True)
        if status not in (200, 409):
            raise SystemExit(f"version {artifact_id} failed {status}")
        rule = {"ruleType": "COMPATIBILITY", "config": "BACKWARD"}
        status, body = request(
            "POST",
            BASE + f"/apis/registry/v3/groups/workshop/artifacts/{artifact_id}/rules",
            rule,
        )
        print(artifact_id, "rule", status, body[:200], flush=True)
        if status not in (200, 204, 409):
            raise SystemExit(f"rule {artifact_id} failed {status}")
        status, _ = request(
            "GET",
            BASE + f"/apis/registry/v3/groups/workshop/artifacts/{artifact_id}/versions/2/content",
        )
        if status != 200:
            status, _ = request(
                "GET",
                BASE + f"/apis/registry/v3/groups/workshop/artifacts/{artifact_id}/versions/1/content",
            )
        print(artifact_id, "get", status, flush=True)
        if status != 200:
            raise SystemExit(f"get {artifact_id} failed {status}")

    def submit_contract():
        raw = (ROOT / "neuralbank-cdc.yaml").read_bytes()
        url = BASE + "/apis/registry/v3/groups/workshop/contracts"
        req = urllib.request.Request(url, data=raw, method="POST")
        req.add_header("Content-Type", "application/x-yaml")
        try:
            with urllib.request.urlopen(req, timeout=20) as resp:
                status, body = resp.status, resp.read()
        except urllib.error.HTTPError as exc:
            status, body = exc.code, exc.read()
        print("contract", status, body[:400], flush=True)
        if status in (200, 201):
            return
        put = urllib.request.Request(
            url + "/neuralbank-cdc", data=raw, method="PUT"
        )
        put.add_header("Content-Type", "application/x-yaml")
        try:
            with urllib.request.urlopen(put, timeout=20) as resp:
                status, body = resp.status, resp.read()
        except urllib.error.HTTPError as exc:
            status, body = exc.code, exc.read()
        print("contract-put", status, body[:400], flush=True)
        if status not in (200, 201, 204, 409):
            raise SystemExit(f"contract failed {status}")

    def govern(artifact_id):
        status, body = request(
            "PUT",
            BASE + f"/apis/registry/v3/groups/workshop/artifacts/{artifact_id}/contract/compatibility-group",
            {"contractId": "neuralbank-cdc", "compatibilityGroup": "neuralbank-cdc"},
        )
        print(artifact_id, "compat", status, body[:200], flush=True)
        if status not in (200, 204):
            raise SystemExit(f"compat {artifact_id} failed {status}")
        status, body = request(
            "POST",
            BASE + f"/apis/registry/v3/groups/workshop/artifacts/{artifact_id}/contract/promote",
            {"contractId": "neuralbank-cdc", "targetStage": "PROD"},
        )
        print(artifact_id, "stage", status, body[:200], flush=True)
        if status not in (200, 204):
            raise SystemExit(f"stage {artifact_id} failed {status}")

    def describe_group():
        status, body = request(
            "PUT",
            BASE + "/apis/registry/v3/groups/workshop",
            {
                "description": "NeuralBank CDC contracts. Customers and orders copied from PostgreSQL, validated by Camel before the email pipeline.",
                "labels": {
                    "domain": "neuralbank",
                    "source": "postgresql",
                    "owner": "neuralbank-platform",
                },
            },
        )
        print("group", status, body[:200], flush=True)
        if status not in (200, 204):
            raise SystemExit(f"group failed {status}")

    wait_ready()
    for artifact_id, meta in ARTIFACTS.items():
        ensure(artifact_id, meta)
    submit_contract()
    for artifact_id in ARTIFACTS:
        govern(artifact_id)
    describe_group()
    print("seed ok", flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cdc-registry-seed-contracts
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: registry.access.redhat.com/ubi9/python-311:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/schemas/seed.py"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          volumeMounts:
            - name: schemas
              mountPath: /schemas
      volumes:
        - name: schemas
          configMap:
            name: cdc-registry-schemas
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: cdc-camel-router
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec: {}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: cdc-camel-router
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
  source:
    type: Git
    git:
      uri: https://github.com/maximilianoPizarro/openshift-kafka-day-roadshow.git
      ref: main
    contextDir: camel/cdc-router
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  resources:
    requests:
      memory: 1Gi
      cpu: 200m
    limits:
      memory: 2Gi
      cpu: "1"
  output:
    to:
      kind: ImageStreamTag
      name: cdc-camel-router:latest
  triggers:
    - type: ConfigChange
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdc-camel-routes
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  routes.yaml: |
    - onException:
        exception:
          - java.lang.IllegalStateException
        redeliveryPolicy:
          maximumRedeliveries: -1
          redeliveryDelay: 5000
        handled:
          constant: "false"
    - route:
        id: schema-check
        from:
          uri: "kafka:camel.schema-check"
          parameters:
            brokers: "cdc-cluster-kafka-bootstrap:9092"
            groupId: "camel-schema-check"
            autoOffsetReset: "earliest"
            breakOnFirstError: "true"
            valueDeserializer: "org.apache.kafka.common.serialization.StringDeserializer"
          steps:
            - setProperty:
                name: eventSource
                constant: bridge
            - setProperty:
                name: schemaArtifact
                constant: customers-value
            - setProperty:
                name: originalBody
                simple: "${body}"
            - doTry:
                steps:
                  - unmarshal:
                      json: {}
                  - bean:
                      ref: schemaGuard
                      method: validateCustomer
                  - bean:
                      ref: schemaGuard
                      method: successBody
                  - to:
                      uri: "kafka:camel.validated"
                      parameters:
                        brokers: "cdc-cluster-kafka-bootstrap:9092"
                        valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
                doCatch:
                  - exception:
                      - java.lang.Exception
                    steps:
                      - bean:
                          ref: schemaGuard
                          method: rethrowIfFetchFailure
                      - bean:
                          ref: schemaGuard
                          method: errorBody
                      - to:
                          uri: "kafka:camel.schema-errors"
                          parameters:
                            brokers: "cdc-cluster-kafka-bootstrap:9092"
                            valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
    - route:
        id: cdc-customers
        from:
          uri: "kafka:cdc.public.customers"
          parameters:
            brokers: "cdc-cluster-kafka-bootstrap:9092"
            groupId: "camel-cdc-customers"
            autoOffsetReset: "earliest"
            breakOnFirstError: "true"
            valueDeserializer: "org.apache.kafka.common.serialization.StringDeserializer"
          steps:
            - setProperty:
                name: eventSource
                constant: debezium
            - setProperty:
                name: schemaArtifact
                constant: customers-value
            - setProperty:
                name: originalBody
                simple: "${body}"
            - doTry:
                steps:
                  - unmarshal:
                      json: {}
                  - bean:
                      ref: schemaGuard
                      method: customerAfter
                  - bean:
                      ref: schemaGuard
                      method: validateCustomer
                  - bean:
                      ref: schemaGuard
                      method: successBody
                  - to:
                      uri: "kafka:camel.public.customers"
                      parameters:
                        brokers: "cdc-cluster-kafka-bootstrap:9092"
                        valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
                doCatch:
                  - exception:
                      - java.lang.Exception
                    steps:
                      - bean:
                          ref: schemaGuard
                          method: rethrowIfFetchFailure
                      - bean:
                          ref: schemaGuard
                          method: errorBody
                      - to:
                          uri: "kafka:camel.schema-errors"
                          parameters:
                            brokers: "cdc-cluster-kafka-bootstrap:9092"
                            valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
    - route:
        id: cdc-orders
        from:
          uri: "kafka:cdc.public.orders"
          parameters:
            brokers: "cdc-cluster-kafka-bootstrap:9092"
            groupId: "camel-cdc-orders"
            autoOffsetReset: "earliest"
            breakOnFirstError: "true"
            valueDeserializer: "org.apache.kafka.common.serialization.StringDeserializer"
          steps:
            - setProperty:
                name: eventSource
                constant: debezium
            - setProperty:
                name: schemaArtifact
                constant: orders-value
            - setProperty:
                name: originalBody
                simple: "${body}"
            - doTry:
                steps:
                  - unmarshal:
                      json: {}
                  - bean:
                      ref: schemaGuard
                      method: orderAfter
                  - bean:
                      ref: schemaGuard
                      method: validateOrder
                  - bean:
                      ref: schemaGuard
                      method: successBody
                  - to:
                      uri: "kafka:camel.public.orders"
                      parameters:
                        brokers: "cdc-cluster-kafka-bootstrap:9092"
                        valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
                doCatch:
                  - exception:
                      - java.lang.Exception
                    steps:
                      - bean:
                          ref: schemaGuard
                          method: rethrowIfFetchFailure
                      - bean:
                          ref: schemaGuard
                          method: errorBody
                      - to:
                          uri: "kafka:camel.schema-errors"
                          parameters:
                            brokers: "cdc-cluster-kafka-bootstrap:9092"
                            valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-camel-router
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdc-camel-router
  template:
    metadata:
      labels:
        app: cdc-camel-router
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: image-registry.openshift-image-registry.svc:5000/kafka-cdc/cdc-camel-router:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: APICURIO_BASE_URL
              value: http://cdc-registry-app-service.kafka-cdc.svc:8080
            - name: KAFKA_BOOTSTRAP
              value: cdc-cluster-kafka-bootstrap:9092
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - name: routes
              mountPath: /etc/camel
              readOnly: true
      volumes:
        - name: routes
          configMap:
            name: cdc-camel-routes
