apiVersion: console.strimzi.io/v1alpha1
kind: StrimziKafkaConsole
metadata:
  name: kafka-console
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  kafkaClusters:
    - name: cdc-cluster
      namespace: kafka-cdc
      listener: plain
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kafka-console
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  to:
    kind: Service
    name: kafka-console-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
