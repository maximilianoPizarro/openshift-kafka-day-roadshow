apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: kafka-grafana
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    dashboards: kafka-grafana
spec:
  config:
    auth.anonymous:
      enabled: "true"
      org_role: Viewer
    security:
      admin_user: admin
      admin_password: admin
      allow_embedding: "true"

  route:
    spec:
      tls:
        termination: edge
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instanceSelector:
    matchLabels:
      dashboards: kafka-grafana
  valuesFrom:
    - targetPath: secureJsonData.httpHeaderValue1
      valueFrom:
        secretKeyRef:
          name: grafana-thanos-token
          key: token
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
    isDefault: true
    jsonData:
      httpHeaderName1: Authorization
      timeInterval: 5s
      tlsSkipVerify: true
    secureJsonData:
      httpHeaderValue1: "Bearer ${token}"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kafka-overview
  namespace: kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instanceSelector:
    matchLabels:
      dashboards: kafka-grafana
  json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Messages In Per Second",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(kafka_server_brokertopicmetrics_messagesinpersec_total{topic=~\"cdc[.]public[.].+\"}[5m]))",
              "legendFormat": "Messages/sec"
            }
          ]
        },
        {
          "title": "Bytes In Per Second",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(kafka_server_brokertopicmetrics_bytesinpersec_total{topic=~\"cdc[.]public[.].+\"}[5m]))",
              "legendFormat": "Bytes/sec"
            }
          ]
        },
        {
          "title": "Consumer Group Lag",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum by (consumergroup, topic) (kafka_consumergroup_lag)",
              "legendFormat": "{{`{{consumergroup}}`}} / {{`{{topic}}`}}"
            }
          ]
        },
        {
          "title": "Debezium Events",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(debezium_metrics_totalnumberofeventsseen[5m]))",
              "legendFormat": "CDC events/sec"
            }
          ]
        },
        {
          "title": "Kafka Connect Tasks Running",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "count(kafka_connect_task_batch_size_max)",
              "legendFormat": "Running"
            }
          ]
        },
        {
          "title": "Active Partitions",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 16 },
          "targets": [
            {
              "expr": "count(kafka_log_log_logendoffset)",
              "legendFormat": "Partitions"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["kafka", "cdc", "debezium"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Kafka CDC Overview",
      "uid": "kafka-cdc-overview"
    }
