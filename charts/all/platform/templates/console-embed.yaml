{{- $domain := .Values.clusterDomain | default "apps.cluster.example.com" }}
apiVersion: v1
kind: Namespace
metadata:
  name: ocp-console-embed
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocp-console-embed
  namespace: ocp-console-embed
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ocp-console-embed-route-manager
  namespace: openshift-authentication
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    resourceNames: ["oauth-openshift"]
    verbs: ["get", "patch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes/custom-host"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ocp-console-embed-route-manager
  namespace: openshift-authentication
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ocp-console-embed-route-manager
subjects:
  - kind: ServiceAccount
    name: ocp-console-embed
    namespace: ocp-console-embed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocp-console-embed-service-ca
  namespace: ocp-console-embed
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    service.beta.openshift.io/inject-cabundle: "true"
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocp-console-embed-webhook-script
  namespace: ocp-console-embed
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  webhook.py: |
{{ .Files.Get "files/webhook.py" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ocp-console-embed-webhook
  namespace: ocp-console-embed
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    service.beta.openshift.io/serving-cert-secret-name: ocp-console-embed-webhook-tls
spec:
  selector:
    app: ocp-console-embed-webhook
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocp-console-embed-webhook
  namespace: ocp-console-embed
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocp-console-embed-webhook
  template:
    metadata:
      labels:
        app: ocp-console-embed-webhook
    spec:
      serviceAccountName: ocp-console-embed
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: registry.access.redhat.com/ubi9/python-311:latest
          command: ["python3", "-u", "/webhook/webhook.py"]
          ports:
            - containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: service-ca
              mountPath: /service-ca
              readOnly: true
            - name: script
              mountPath: /webhook
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: ocp-console-embed-webhook-tls
        - name: service-ca
          configMap:
            name: ocp-console-embed-service-ca
        - name: script
          configMap:
            name: ocp-console-embed-webhook-script
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: ocp-console-embed-oauth-route
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: oauth-route.ocp-console-embed.redhat.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: Never
    rules:
      - apiGroups: ["route.openshift.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["routes"]
        scope: Namespaced
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openshift-authentication
    clientConfig:
      service:
        name: ocp-console-embed-webhook
        namespace: ocp-console-embed
        path: /mutate
        port: 443
---
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  httpHeaders:
    actions:
      response:
        - name: X-Frame-Options
          action:
            type: Delete
        - name: Content-Security-Policy
          action:
            type: Set
            set:
              value: "frame-ancestors 'self' https://*.{{ $domain }}"
        - name: Origin-Agent-Cluster
          action:
            type: Set
            set:
              value: "?1"
