apiVersion: v1
kind: Namespace
metadata:
  name: workshop-identity
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-oauth
  namespace: workshop-identity
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-oauth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["config.openshift.io"]
    resources: ["oauths"]
    resourceNames: ["cluster"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-oauth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-oauth
subjects:
  - kind: ServiceAccount
    name: workshop-oauth
    namespace: workshop-identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workshop-oauth
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["workshop-htpasswd"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-oauth
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workshop-oauth
subjects:
  - kind: ServiceAccount
    name: workshop-oauth
    namespace: workshop-identity
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-oauth
  namespace: workshop-identity
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  oauth.py: |
{{ .Files.Get "files/oauth.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workshop-oauth
  namespace: workshop-identity
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: workshop-oauth
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth
          image: registry.access.redhat.com/ubi9/python-311:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/oauth/oauth.py"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /oauth
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: workshop-oauth
