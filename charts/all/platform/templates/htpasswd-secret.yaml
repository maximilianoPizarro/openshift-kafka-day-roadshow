apiVersion: v1
kind: Secret
metadata:
  name: workshop-htpasswd
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  htpasswd: |
    {{- range $i := until (int .Values.userCount) }}
    {{ printf "user%d:{SHA}Y8G9w3Gr8Xk7wCpfl3mOr8KCbr4=" (add1 $i) }}
    {{- end }}
