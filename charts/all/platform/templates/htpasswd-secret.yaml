apiVersion: v1
kind: Secret
metadata:
  name: workshop-htpasswd
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  # {SHA} is Apache SHA-1 of the password. Both defaults are Welcome123!.
  # Y8G9w3Gr8Xk7wCpfl3mOr8KCbr4= is the hash of that password.
  htpasswd: |
    {{- $hash := "{SHA}Y8G9w3Gr8Xk7wCpfl3mOr8KCbr4=" }}
    {{- range $i := until (int .Values.userCount) }}
    {{ printf "user%d:%s" (add1 $i) $hash }}
    {{- end }}
    {{ .Values.kubeadmin.username }}:{{ $hash }}
