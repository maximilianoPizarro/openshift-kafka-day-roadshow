apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-kubeadmin
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ .Values.kubeadmin.username }}
{{- range $i := until (int .Values.userCount) }}
{{- $user := printf "user%d" (add1 $i) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $user }}-workshop
  labels:
    workshop: kafka-cdc
    user: {{ $user }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $user }}-admin
  namespace: {{ $user }}-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user }}
---
# OpenShift ClusterRole admin does not cover Camel K CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $user }}-camel-integrations
  namespace: {{ $user }}-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["camel.apache.org"]
    resources: ["integrations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $user }}-camel-integrations
  namespace: {{ $user }}-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $user }}-camel-integrations
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $user }}-view-kafka-cdc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $user }}
{{- end }}
