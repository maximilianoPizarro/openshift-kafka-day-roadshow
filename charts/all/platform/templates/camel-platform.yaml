apiVersion: v1
kind: ServiceAccount
metadata:
  name: workshop-camel-platform
  namespace: workshop-identity
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workshop-camel-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["integrationplatforms.camel.apache.org"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: ["camel.apache.org"]
    resources: ["integrationplatforms"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-camel-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workshop-camel-platform
subjects:
  - kind: ServiceAccount
    name: workshop-camel-platform
    namespace: workshop-identity
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-camel-platform
  namespace: workshop-identity
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  camel_platform.py: |
{{ .Files.Get "files/camel_platform.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workshop-camel-platform
  namespace: workshop-identity
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: workshop-camel-platform
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: camel-platform
          image: registry.access.redhat.com/ubi9/python-311:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/script/camel_platform.py"]
          env:
            - name: USER_COUNT
              value: {{ .Values.userCount | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: workshop-camel-platform
