---
type: showroom

default_width: 30
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

antora:
  dir: kafka-day-roadshow
  name: main
  modules:
    - name: index
      label: Welcome
    - name: 01-setup
      label: Lab Setup & Overview
    - name: 02-kafka-fundamentals
      label: Kafka Fundamentals
    - name: 03-event-producer
      label: Event Producer
    - name: 04-event-consumer
      label: Event Consumer
    - name: 05-debezium-cdc
      label: Debezium CDC
    - name: 06-camel-apicurio
      label: Camel and Apicurio
    - name: 07-monitoring
      label: Monitoring
    - name: 08-summary
      label: Wrap-up

tabs:
  - name: Terminal
    path: /terminal
    port: 443

  - name: Kafka Console
    url: 'https://kafka-console-kafka-cdc.${DOMAIN}'

  - name: Mailpit
    url: 'https://mailpit-kafka-cdc.${DOMAIN}'

  - name: Grafana
    url: 'https://kafka-grafana-route-kafka-cdc.${DOMAIN}'

  - name: Registry
    url: 'https://cdc-registry-ui-kafka-cdc.${DOMAIN}'

  - name: OCP Console
    url: 'https://showroom-showroom.${DOMAIN}/kafka-day-roadshow/main/openshift-console.html'
